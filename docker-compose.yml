x-application-base: &application-builder
    build:
        context: .
        dockerfile: 'docker/php/Dockerfile'
    working_dir: /application
    env_file: .env
    networks:
        - 'private'
    restart: unless-stopped

services:
    application-migration:
        <<: *application-builder

        container_name: application-migration
        command: php artisan migrate --force
        restart: 'no'

        depends_on:
            mysql:
                condition: service_healthy

        healthcheck:
            disable: true
            test: ['NONE']

    #application-scribe:
    #    <<: *application-builder
#
    #    container_name: application-scribe
    #    command: php artisan scribe:generate
    #    restart: 'no'
#
    #    depends_on:
    #        mysql:
    #            condition: service_healthy
#
    #    healthcheck:
    #        disable: true
    #        test: ['NONE']

    application:
        <<: *application-builder

        container_name: application
        environment:
            SERVER_NAME: 'test-saloon.local'
            CADDY_GLOBAL_OPTIONS: 'debug'
        command: frankenphp run --config /etc/frankenphp/Caddyfile

        depends_on:
            application-migration:
                condition: service_completed_successfully
        ports:
            - '8080:80'
            - '443:443'
            - '443:443/udp'
        volumes:
            - '.:/application'
            - 'caddy-data:/data'
            - 'caddy-config:/data'
            - './docker/php/conf.d/:/etc/php/8.4/fpm/conf.d/'
            - './docker/php/conf.d/:/etc/php/8.4/cli/conf.d/'
            - './docker/webserver/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile'
            - './docker/webserver/frankenphp/Caddyfile.d:/etc/frankenphp/Caddyfile.d'
        networks:
            - 'public'
            - 'private'

    queue:
        <<: *application-builder

        build:
            context: .
            dockerfile: 'docker/php/Dockerfile'
            target: queue
        container_name: application-queue
        command: frankenphp php-cli ./artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=32
        restart: on-failure

        depends_on:
            application-migration:
                condition: service_completed_successfully
            rabbitmq:
                condition: service_healthy
        volumes:
            - '.:/application'

        healthcheck:
            disable: true
            test: ['NONE']

    #schedule:
    #    <<: *application-builder
    #
    #    command: supercronic /etc/supercronic/laravel
    #
    #    healthcheck:
    #        disable: true
    #        test: ['NONE']

    mysql:
        image: 'mysql:8.0'
        container_name: mysql
        volumes:
            - 'mysql-data:/var/lib/mysql/'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: y
        ports:
            - '42002:${DB_PORT}'
        networks:
            - 'private'
        healthcheck:
            test: ['CMD', 'mysql', '-u', '${DB_USERNAME}', '-p${DB_PASSWORD}', '--execute', 'SHOW DATABASES;']
            interval: 30s
            timeout: 20s
            retries: 8

